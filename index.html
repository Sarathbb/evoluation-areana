<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1424">
<meta name="description" content="Evolution Arena: spawn as an egg, eat, evolve through 12 creatures, fight rivals and world bosses.">
<title>Evolution Arena</title>
<style>
:root{--bg:#0e1424;--panel:#17213a;--panel2:#22315a;--ink:#eef3ff;--mut:#9fb0d6;--acc:#ffd23f;--grn:#5be584;--red:#ff5d6c;--blu:#4dabff;--pur:#b388ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:8px 14px;transition:transform .08s,background .15s}
button:hover{background:#2e4180}button:active{transform:scale(.96)}
button.pri{background:linear-gradient(180deg,#ffd23f,#ffa51f);color:#2a1a00;font-weight:700}
button.pri:hover{filter:brightness(1.1)}
button.grn{background:#1f9d55}button.red{background:#c0392b}
button[disabled]{opacity:.45;cursor:default}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
.scr.on{display:flex}
.card{background:var(--panel);border:1px solid #2c3d6d;border-radius:16px;padding:18px;max-width:min(920px,96vw);max-height:92vh;overflow:auto;position:relative;box-shadow:0 20px 60px #0008;touch-action:pan-y}
.x{position:absolute;right:10px;top:10px;padding:4px 10px}
h1{margin:0;font-size:clamp(26px,5vw,44px);letter-spacing:.5px}
h2{margin:0 0 10px;font-size:22px}h3{margin:12px 0 6px;font-size:16px;color:var(--acc)}
.mut{color:var(--mut)}small{color:var(--mut)}
/* menu */
#menu{background:radial-gradient(ellipse at 50% 20%,#1b2c57cc,#0e1424f0 70%);overflow:auto;align-items:flex-start;touch-action:pan-y}
.mw{width:min(980px,96vw);margin:0 auto;padding:18px 0 40px}
.mh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cur{display:flex;gap:8px;flex-wrap:wrap}
.cur span{background:var(--panel);border:1px solid #2c3d6d;border-radius:999px;padding:5px 12px;font-weight:600}
.prof{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid #2c3d6d;border-radius:14px;padding:10px 14px;margin:14px 0}
.prof input{background:#0e1730;border:1px solid #2c3d6d;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;width:150px;user-select:text;-webkit-user-select:text}
.lvbar{flex:1;min-width:140px;height:12px;background:#0b1226;border-radius:99px;overflow:hidden}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#5be584,#4dabff)}
.event{background:linear-gradient(90deg,#4a2a7a,#2a3f7a);border-radius:12px;padding:8px 14px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--panel);border:1px solid #2c3d6d;border-radius:14px;padding:14px;text-align:left;display:block;width:100%}
.mode:hover{border-color:var(--acc);background:#1c2a4d}
.mode .ic{font-size:34px}.mode b{display:block;font-size:17px;margin:4px 0}.mode span{color:var(--mut);font-size:13px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.nav button{flex:1;min-width:110px;padding:12px}
.daily{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffd23f55}}
/* tables/grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:#101a33;border:1px solid #2c3d6d;border-radius:12px;padding:10px;text-align:center}
.it.eq{border-color:var(--grn)}
.pv{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:32px}
.pv.em{background:#0b1226}.pv.pl{border-radius:10px;width:auto;height:36px;font-size:15px;font-weight:700;margin:14px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--acc);color:#2a1a00;font-weight:700}
.row{display:flex;align-items:center;gap:10px;background:#101a33;border:1px solid #2c3d6d;border-radius:10px;padding:8px 12px;margin-bottom:6px}
.row .g{flex:1}.row .pb{height:8px;background:#0b1226;border-radius:9px;overflow:hidden;margin-top:4px}.row .pb i{display:block;height:100%;background:var(--grn)}
.row.done{border-color:var(--grn)}
table{width:100%;border-collapse:collapse}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid #22315a}tr.me td{color:var(--acc);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#101a33;border:1px solid #2c3d6d;border-radius:10px;padding:6px;text-align:center;font-size:12px}.day.on{border-color:var(--acc);background:#2a2a10}.day.past{opacity:.55}
.tier{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.tier>div{background:#101a33;border:1px solid #2c3d6d;border-radius:10px;padding:6px 8px;font-size:13px;min-height:40px}
.tier .n{text-align:center;font-weight:700;background:none;border:0}
.tier .lock{opacity:.5}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button{pointer-events:auto}
#hudL{position:absolute;left:10px;top:10px;width:min(260px,52vw)}
#stName img{width:34px;height:34px;vertical-align:middle}
#stName{font-weight:800;font-size:18px;text-shadow:0 2px 4px #000}
.bar{position:relative;height:16px;background:#0008;border-radius:99px;overflow:hidden;margin:4px 0;border:1px solid #fff2}
.bar i{display:block;height:100%}.bar.xp i{background:linear-gradient(90deg,#4dabff,#b388ff)}.bar.hp i{background:linear-gradient(90deg,#ff5d6c,#5be584)}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
.chip{display:inline-block;background:#000a;border:1px solid var(--pur);border-radius:99px;padding:2px 10px;font-size:12px;margin-top:2px}
#feed{margin-top:8px;font-size:12px;line-height:1.5;text-shadow:0 1px 3px #000}
#feed div{background:#0007;border-radius:6px;padding:1px 6px;margin-bottom:2px;width:fit-content;max-width:100%}
#hudR{position:absolute;right:10px;top:10px;width:150px;text-align:right}
#mini{width:130px;height:130px;border-radius:10px;background:#0009;border:1px solid #fff3}
#lb{margin-top:6px;font-size:12px;background:#0007;border-radius:8px;padding:4px 8px;text-align:left}
#lb div{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}#lb .me{color:var(--acc);font-weight:700}
#hudC{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 2px 4px #000}
#bossBar{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:min(300px,60vw);text-align:center;font-weight:800;text-shadow:0 2px 4px #000}
#bossBar .bar i{background:linear-gradient(90deg,#ff5d6c,#ff9f1c)}
#teamScore{font-size:20px}#timer{font-size:15px}
#banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:clamp(18px,3.4vw,30px);font-weight:800;text-align:center;text-shadow:0 3px 8px #000;opacity:0;transition:opacity .3s;width:90vw}
#banner.on{opacity:1}
#hint{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#000a;border-radius:10px;padding:6px 14px;font-size:14px;text-align:center;opacity:0;transition:opacity .4s;width:max-content;max-width:92vw}
#hint.on{opacity:1}
#evoBanner{position:absolute;left:50%;top:30%;transform:translateX(-50%) scale(.9);background:linear-gradient(180deg,#2b1a5acc,#101a33dd);border:2px solid var(--acc);border-radius:16px;padding:12px 22px;text-align:center;opacity:0;transition:all .35s;max-width:92vw}
#evoBanner.on{opacity:1;transform:translateX(-50%) scale(1)}
#evoBanner .big{font-size:26px;font-weight:800}
#pauseBtn{position:absolute;left:50%;top:56px;transform:translateX(-50%);padding:2px 12px;opacity:.7}
#abar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;max-width:94vw;overflow-x:auto;padding:4px;pointer-events:auto}
#abar button{position:relative;width:46px;height:46px;flex:none;padding:0;font-size:22px;background:#0009;border:2px solid #fff3;overflow:hidden}
#abar button.sel{border-color:var(--acc)}
#abar button u{position:absolute;left:3px;top:0;font-size:10px;text-decoration:none;color:var(--mut)}
#abar button s{position:absolute;left:0;bottom:0;width:100%;height:0;background:#000b}
#fireBtn{position:absolute;right:16px;bottom:74px;width:76px;height:76px;border-radius:50%;font-size:32px;background:#ffa51fcc;display:none}
.touch #fireBtn{display:block}
#netStat{position:absolute;left:10px;bottom:10px;font-size:11px;color:#9fb0d6;text-shadow:0 1px 2px #000;pointer-events:none}
#netStat.bad{color:#ff8a8a;font-weight:700}
#toasts{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toasts div{background:#101a33f0;border:1px solid var(--acc);border-radius:10px;padding:7px 14px;animation:tin .25s;font-size:14px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.big-num{font-size:34px;font-weight:800;color:var(--acc)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin:10px 0}.res div{display:flex;justify-content:space-between;border-bottom:1px solid #22315a;padding:3px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 120px 30px #ff1f3a;opacity:0;transition:opacity .25s}
#vig.on{animation:vig 1s infinite}@keyframes vig{50%{filter:brightness(1.6)}}
#tut{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#0b1226ee;border:2px solid var(--acc);border-radius:12px;padding:8px 14px;width:min(420px,92vw);pointer-events:auto}
#tut div{padding:2px 0;color:var(--mut)}#tut div.cur{color:var(--ink);font-weight:700}#tut div.ok{color:var(--grn)}
#tut button{margin-top:6px;padding:3px 12px;font-size:13px}
@media(max-width:560px){#hudR{width:110px}#mini{width:100px;height:100px}#lb{font-size:10px}.res{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="vig"></div>
<div id="hud" class="hide">
  <div id="tut" class="hide"></div>
  <div id="hudL">
    <div id="stName">Egg</div>
    <div class="bar xp"><i id="xpFill"></i><span id="xpTxt"></span></div>
    <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
    <div id="mutChip" class="chip hide"></div>
    <div id="feed"></div>
  </div>
  <div id="hudR"><canvas id="mini" width="260" height="260"></canvas><div id="lb"></div></div>
  <div id="hudC"><div id="teamScore"></div><div id="timer"></div><div id="evtChip" class="chip hide"></div></div>
  <div id="bossBar" class="hide"><div id="bbName"></div><div class="bar hp"><i id="bbFill"></i><span id="bbTxt"></span></div></div>
  <button id="pauseBtn" onclick="pauseGame(true)">❚❚</button>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="evoBanner"></div>
  <div id="netStat" class="hide"></div>
  <div id="abar"></div>
  <button id="fireBtn">⚡</button>
</div>

<div id="menu" class="scr on"><div class="mw">
  <div class="mh"><h1>🥚 → 🗿 Evolution Arena</h1><div class="cur"><span>🪙 <b id="mCoins">0</b></span><span title="DNA shards">🧬 <b id="mDna">0</b></span><span title="Gems (earned in play, never bought)">💎 <b id="mGems">0</b></span></div></div>
  <div class="prof">
    <div>👤 <input id="nameIn" maxlength="14" placeholder="Your name"></div>
    <div>Level <b id="mLvl">1</b></div><div class="lvbar"><i id="mLvlBar"></i></div>
    <div id="mTier"></div><div id="mClan" class="mut"></div>
  </div>
  <div id="event" class="event"></div>
  <div class="modes" id="modes"></div>
  <div class="nav">
    <button onclick="openDex()">🧬 Evolution Dex</button>
    <button onclick="openShop('skin')">🛍️ Shop</button>
    <button onclick="openQuests()" id="qBtn">📜 Quests &amp; Daily</button>
    <button onclick="openPass()">🎟️ Battle Pass</button>
    <button onclick="openSocial('lb')">👥 Clan &amp; Ladder</button>
    <button onclick="openSettings()">⚙️ Settings &amp; Help</button>
  </div>
</div></div>

<div id="modal" class="scr" style="background:#000a"><div class="card"><button class="x" onclick="closeModal()">✕</button><div id="mbody"></div></div></div>

<div id="dead" class="scr" style="background:#000b"><div class="card" style="text-align:center;width:min(560px,96vw)"><div id="dbody"></div></div></div>
<div id="pause" class="scr" style="background:#000a"><div class="card" style="text-align:center"><h2>Paused</h2><div class="btns"><button class="pri" onclick="pauseGame(false)">Resume</button><button class="red" onclick="quitRun()">End run &amp; collect rewards</button></div></div></div>
<div id="ad" class="scr" style="background:#000d"><div class="card" style="text-align:center"><h2>📺 Rewarded ad (demo placeholder)</h2><p class="mut">No real ad is shown in this build. In a published version your ad network goes here.</p><div class="big-num" id="adCount">5</div><div class="btns"><button onclick="cancelAd()">Cancel</button></div></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ===================================================================== DATA */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const STAGES=[
 {n:'Egg',e:'🥚',ab:'harden'},{n:'Ant',e:'🐜',ab:'spit'},{n:'Mouse',e:'🐭',ab:'scurry'},{n:'Rat',e:'🐀',ab:'plague'},
 {n:'Rabbit',e:'🐇',ab:'hop'},{n:'Fox',e:'🦊',ab:'cloak'},{n:'Wolf',e:'🐺',ab:'howl'},{n:'Tiger',e:'🐯',ab:'pounce'},
 {n:'Bear',e:'🐻',ab:'slam'},{n:'Dragon',e:'🐉',ab:'fire'},{n:'Phoenix',e:'🦅',ab:'rebirth'},{n:'Titan',e:'🗿',ab:'quake'}];

const BIOMES={forest:'Whispering Forest',ice:'Frozen Tundra',sea:'Abyssal Sea',lava:'Magma Fields',shadow:'Shadow Core'};

   const sp=(200+p.stage*4)*(p.mut==='swift'?1.15:1)*(p.fx.speed?1.8:1)*(p.fx.slow?.5:1)*(p.fx.stun?0:1),kk=Math.min(1,dt*9);
   c.pvx=(c.pvx||0)+(p.wx*sp-(c.pvx||0))*kk;c.pvy=(c.pvy||0)+(p.wy*sp-(c.pvy||0))*kk;
   c.tx+=c.vx*dt;c.ty+=c.vy*dt;c.x+=c.pvx*dt;c.y+=c.pvy*dt;const cr=Math.min(1,dt*3.5);c.x+=(c.tx-c.x)*cr;c.y+=(c.ty-c.y)*cr;
   const sp2=Math.hypot(c.pvx,c.pvy);if(sp2>25)c.ang=lerpAng(c.ang,Math.atan2(c.pvy,c.pvx),Math.min(1,dt*9));c.ph+=sp2*dt*.028;continue}
  c.pvx=c.vx;c.pvy=c.vy;
  c.x+=(c.tx-c.x)*k;c.y+=(c.ty-c.y)*k;c.tx+=c.vx*dt;c.ty+=c.vy*dt;const sp2=Math.hypot(c.vx,c.vy);if(sp2>25)c.ang=lerpAng(c.ang,Math.atan2(c.vy,c.vx),Math.min(1,dt*(c.boss?4:9)));c.ph+=sp2*dt*.028}
 for(const q of g.proj){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}
 for(const z of g.zones)z.life-=dt;
 for(const r of g.rings)r.t+=dt;
 if(g.evt)g.evt.t+=dt;
 for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.dr){const dk=Math.exp(-q.dr*dt);q.vx*=dk;q.vy*=dk}q.life-=dt;if(q.life<=0)g.parts.splice(i,1)}
 if(g.parts.length>700)g.parts.splice(0,g.parts.length-700);
 for(let i=g.fx.length-1;i>=0;i--){const f=g.fx[i];f.t+=dt;if(f.own&&!f.own.dead){f.x=f.own.x;f.y=f.own.y}if(f.t>=f.life)g.fx.splice(i,1)}
 for(let i=g.txt.length-1;i>=0;i--){const q=g.txt[i];q.t+=dt;q.y-=30*dt;if(q.t>1.4)g.txt.splice(i,1)}
 const tz=clamp(Math.min(SW,SH)/(560+p.r*9),.45,1.15);g.cam.z+=(tz-g.cam.z)*Math.min(1,dt*3);
 g.cam.x+=(p.x-g.cam.x)*Math.min(1,dt*9);g.cam.y+=(p.y-g.cam.y)*Math.min(1,dt*9);g.shake*=Math.exp(-6*dt)}
function netDead(m){
 const g=G;if(!g||!g.online||g.ended)return;
 g.p.dead=true;g.p.totalXp=m.totalXp;g.run=m.run;g.p.run=m.run;g.rankOverride={rank:m.rank,total:m.total,left:!!m.left};sfx('die');
 setTimeout(()=>finishRun(m.killer?{name:m.killer}:null,false),m.killer?900:150)}
function playAgain(m){if(G&&G.online)startOnline();else startGame(m)}
function saveServer(){M.settings.server=($('srvIn').value||'').trim();save();toast('Server address saved')}
/* ===================================================================== INPUT */
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 keys[e.code]=true;initAudio();
 if(!G||G.ended&&!G.p.dead)return;
 if(e.code==='Space'||e.code.indexOf('Arrow')===0)e.preventDefault();
 if(e.code==='Escape'){pauseGame(!G.paused);return}
 if(G.paused||G.over)return;
 const dm={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,Digit6:5,Digit7:6,Digit8:7,Digit9:8,Digit0:9,Minus:10,Equal:11};
 if(e.code in dm&&dm[e.code]<=G.p.stage){G.sel=dm[e.code];fireSel()}
 else if(e.code==='Space')fireSel();
 const em={KeyZ:0,KeyX:1,KeyC:2,KeyV:3};if(e.code in em){const id=M.own.emote[em[e.code]];if(id){if(G.online)netSend({t:'em',e:ITEMS[id].e});else emote(G.p,ITEMS[id].e)}}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G&&!G.ended&&!G.online)pauseGame(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.ended&&!G.online)pauseGame(true)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{initAudio();if(!G)return;
 if(e.pointerType==='touch'){if(!G.joy){G.joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY}}}
 else{G.mouse.x=e.clientX;G.mouse.y=e.clientY;if(e.button===2)fireSel();else G.mouse.down=true}try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!G)return;if(e.pointerType==='touch'){if(G.joy&&G.joy.id===e.pointerId){G.joy.x=e.clientX;G.joy.y=e.clientY}}else{G.mouse.x=e.clientX;G.mouse.y=e.clientY}});
const pup=e=>{if(!G)return;if(e.pointerType==='touch'){if(G.joy&&G.joy.id===e.pointerId)G.joy=null}else G.mouse.down=false};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
/* ===================================================================== MENU BACKDROP + LOOP */
const bgMons=[];for(let i=0;i<14;i++)bgMons.push({i:i%12,x:Math.random(),y:Math.random(),s:20+Math.random()*50,v:.01+Math.random()*.02,p:Math.random()*6});
function drawMenuBg(t){ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#14224a');g.addColorStop(1,'#0b1020');ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);
 ctx.globalAlpha=.3;for(const m of bgMons){const z=m.s*2.6,cx=((m.x+t*m.v*.1)%1.1)*SW,cy=m.y*SH+Math.sin(t+m.p)*14;ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(t*.7+m.p)*.2);ctx.drawImage(spriteCanvas(m.i,false,96),-z/2,-z/2,z,z);ctx.restore()}ctx.globalAlpha=1}
let lastF=performance.now();
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastF)/1000);lastF=now;
  if(G){if(G.online)netStep(dt);else if(!G.paused)update(dt);drawWorld(now/1000);G.hudT-=dt;if(G.hudT<=0){G.hudT=.1;if(!G.paused){hudTick();drawMini()}}}
 else drawMenuBg(now/1000)}
dailyInit();renderMenu();requestAnimationFrame(loop);
window.__ea={get G(){return G},get M(){return M},startGame,update,finishRun,spawnBoss,addXp,useAbility,ITEMS};
